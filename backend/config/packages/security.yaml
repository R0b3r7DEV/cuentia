security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Load users from the database by their email. / Carga usuarios de la BD por su email.
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # no login until the e-mail is confirmed / no se entra sin confirmar el email
            user_checker: App\Security\VerifiedEmailChecker

            # Session-based JSON login: POST /api/login with {email, password}.
            # ES: Login JSON con sesión: POST /api/login con {email, password}.
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
                # Clean JSON errors with a stable `code`; deliberately generic (no user enumeration).
                # ES: Errores JSON limpios con un `code` estable; genéricos a propósito.
                failure_handler: App\Security\AuthenticationFailureHandler

            # Brute-force protection: 5 failed logins per minute for an e-mail from one IP (and 25 per IP).
            # The failure handler already answers 429 / too_many_attempts.
            # ES: Protección contra fuerza bruta: 5 intentos fallidos por minuto por email e IP (y 25 por IP).
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

            logout:
                path: api_logout

    # Only the first matching rule applies (order matters).
    # ES: Solo se aplica la primera regla que coincide (el orden importa).
    access_control:
        - { path: ^/api/(login|register|me|health), roles: PUBLIC_ACCESS }
        - { path: ^/api/password/(forgot|reset)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/email/(verify|resend)$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
